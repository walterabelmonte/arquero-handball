<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Arquero Handball 2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Concepto: app de banco de suplentes. Franja azul marino fija arriba, contenido claro, navegación inferior con botones grandes. */
:root {
  --navy: #0b1f3a;
  --navy-2: #14305a;
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #e9eef7;
  --fg: #0b1f3a;
  --muted: #55667f;
  --line: #d6deeb;
  --orange: #ff7a1a;
  --orange-ink: #0b1f3a;
  --green-ink: #0f6b3a;
  --green-bg: #dff3e7;
  --amber-ink: #8a4a00;
  --amber-bg: #ffecd6;
  --grey-ink: #4a5870;
  --grey-bg: #e6ebf3;
  --danger: #b42318;
  --btn-bg: #0b1f3a;
  --btn-fg: #ffffff;
  --focus: #ff7a1a;
  --shadow: 0 1px 2px rgba(11, 31, 58, .08), 0 4px 14px rgba(11, 31, 58, .06);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07142a; --surface: #0f2342; --surface-2: #17305a; --fg: #eef3fb; --muted: #9db0cd; --line: #22406f;
    --green-ink: #7be0a5; --green-bg: #12402b; --amber-ink: #ffc58a; --amber-bg: #4a2a0a; --grey-ink: #b7c4da; --grey-bg: #1c3358;
    --danger: #ff8b7e; --btn-bg: #ff7a1a; --btn-fg: #0b1f3a; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07142a; --surface: #0f2342; --surface-2: #17305a; --fg: #eef3fb; --muted: #9db0cd; --line: #22406f;
  --green-ink: #7be0a5; --green-bg: #12402b; --amber-ink: #ffc58a; --amber-bg: #4a2a0a; --grey-ink: #b7c4da; --grey-bg: #1c3358;
  --danger: #ff8b7e; --btn-bg: #ff7a1a; --btn-fg: #0b1f3a; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.2rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; font-weight: 600; color: var(--muted); }

/* Estructura */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  background: var(--navy); color: #fff;
}
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; max-width: 880px; margin-inline: auto; }
.brand { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: .98rem; line-height: 1.05; flex: 1; min-width: 0; }
.brand small { display: block; font-weight: 500; letter-spacing: .08em; opacity: .75; font-size: .72rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand b { color: var(--orange); }
.brand small.clubline { margin-top: 1px; opacity: .6; text-transform: none; letter-spacing: .02em; }
.clubsel { background: var(--navy-2); color: #fff; border: 1px solid #2a4a7d; border-radius: 10px; min-height: 44px; padding: 0 10px; max-width: 44%; }
.clubsel option { color: #0b1f3a; }
main { max-width: 880px; margin-inline: auto; padding-block: 18px 110px; min-width: 0; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 880px; margin-inline: auto; padding-block: 6px; }
.tab { border: 0; background: none; border-radius: 12px; min-height: 56px; display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .78rem; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.tab[aria-current="page"] svg { color: var(--orange); }

/* Componentes */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.card.tap { width: 100%; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.card.tap:hover { border-color: var(--orange); }
.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 0 18px; font-weight: 700; cursor: pointer; background: var(--btn-bg); color: var(--btn-fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.orange { background: var(--orange); color: var(--orange-ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .92rem; }
.btn.block { width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; white-space: nowrap; background: var(--grey-bg); color: var(--grey-ink); }
.pill.ok { background: var(--green-bg); color: var(--green-ink); }
.pill.warn { background: var(--amber-bg); color: var(--amber-ink); }
.pill.cat { background: var(--surface-2); color: var(--fg); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.avatar { width: 56px; height: 56px; border-radius: 14px; flex: none; background: var(--navy-2); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; overflow: hidden; }
.avatar.lg { width: 84px; height: 84px; font-size: 2rem; border-radius: 18px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.jersey { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; color: var(--orange); min-width: 2ch; text-align: right; line-height: 1; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.nick { color: var(--orange); font-weight: 600; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.banner { border-radius: 12px; padding: 12px 14px; background: var(--amber-bg); color: var(--amber-ink); font-size: .92rem; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: .88rem; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); border: 2px solid var(--surface); }
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .92rem; }
.chip input:checked + span { background: var(--navy); color: #fff; border-color: var(--navy); }
:root[data-theme="dark"] .chip input:checked + span { background: var(--orange); color: var(--navy); border-color: var(--orange); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip input:checked + span { background: var(--orange); color: var(--navy); border-color: var(--orange); } }
.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.searchbar { display: flex; gap: 10px; flex-wrap: wrap; }

/* Formularios */
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.input { width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--surface); color: var(--fg); }
textarea.input { padding: 10px 12px; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
.field.err .input { border-color: var(--danger); }
.err-msg { color: var(--danger); font-size: .85rem; font-weight: 600; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; margin: 0; display: grid; gap: 12px; min-width: 0; }
legend { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; padding: 0 6px; font-size: .95rem; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; cursor: pointer; }
.switch input { width: 24px; height: 24px; accent-color: var(--orange); }
.rosterrow { display: grid; grid-template-columns: 1fr minmax(120px, 40%); gap: 10px; align-items: center; }

/* Hoja modal */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(4, 12, 28, .6); }
.sheet-panel { position: relative; width: min(100%, 640px); max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: -16px; background: var(--bg); padding-block: 4px; z-index: 2; }
@media (min-width: 700px) { .sheet { align-items: center; } .sheet-panel { border-radius: 20px; max-height: 90%; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 60; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); z-index: 15; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); min-height: 56px; border-radius: 28px; padding: 0 22px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 6px 0; }
.photo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .sheet-panel { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } } }

/* ---------- Etapa 2 ---------- */
.tabs-in { grid-template-columns: repeat(5, 1fr); }
.tab { font-size: .72rem; }
.fab.wide { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 848px; margin-inline: auto; justify-content: center; border-radius: 16px; min-height: 60px; font-size: 1.05rem; }
.clock { font-family: var(--f-display); font-weight: 700; font-size: 4.2rem; line-height: 1; letter-spacing: .02em; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side { display: grid; gap: 8px; justify-items: center; align-content: start; padding: 12px 8px; border-radius: 12px; background: var(--surface-2); min-width: 0; text-align: center; }
.side .eyebrow { overflow-wrap: anywhere; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 3.6rem; line-height: 1; }
.ctl-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 .stat b { font-size: 1.9rem; }
.evts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.evt { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.evt.static { cursor: default; justify-items: start; }
button.evt:hover { border-color: var(--orange); }
.zonegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; border: 3px solid var(--fg); border-bottom: 0; border-radius: 8px 8px 0 0; }
.zone { position: relative; }
.zone input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.zone span { display: grid; place-items: center; align-content: center; gap: 2px; min-height: 66px; padding: 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: center; font-size: .74rem; font-weight: 600; }
.zone b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.zone input:checked + span, .btn.on { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.zone input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.sheet-actions { position: sticky; bottom: 0; z-index: 2; background: var(--bg); padding-block: 10px; margin-top: 4px; border-top: 1px solid var(--line); gap: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 420px) { .clock { font-size: 3.6rem; } .score { font-size: 3rem; } }

.has-fab main { padding-bottom: 180px; }
.stats3 .stat b { white-space: nowrap; font-size: clamp(1.45rem, 7vw, 1.9rem); }
.stats3 .stat { min-width: 0; }
.has-fab .toast { bottom: calc(158px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Etapa 3 ---------- */
:root { --heat-good: #8fd6ad; --heat-bad: #ffc08a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --heat-good: #1f7a4a; --heat-bad: #8a4a12; } }
:root[data-theme="dark"] { --heat-good: #1f7a4a; --heat-bad: #8a4a12; }
.tabs-in { grid-template-columns: repeat(7, 1fr); gap: 1px; }
.tab { font-size: .6rem; padding-inline: 0; min-width: 0; }
.tab span { max-width: 100%; white-space: nowrap; }
.goalmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; border: 3px solid var(--fg); border-bottom: 0; border-radius: 8px 8px 0 0; }
.zcell { position: relative; display: grid; align-content: center; justify-items: center; gap: 2px; min-height: 88px; padding: 8px 2px 6px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface-2); color: var(--fg); min-width: 0; }
.zcell .zn { position: absolute; top: 4px; left: 8px; font-family: var(--f-display); font-weight: 700; font-size: .9rem; opacity: .75; }
.zcell b { font-family: var(--f-display); font-size: 1.55rem; line-height: 1; white-space: nowrap; }
.zcell small { font-size: .72rem; opacity: .9; text-align: center; }
.zcell.eff { background: color-mix(in srgb, var(--heat-good) calc(var(--p) * 1%), var(--heat-bad)); }
.zcell.cnt { background: color-mix(in srgb, var(--orange) calc(var(--p) * .55%), var(--surface)); }
.zcell.nd { background: var(--surface-2); }
.zcell[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 1px; }
.barrow { display: grid; grid-template-columns: minmax(106px, 1.4fr) 1.6fr auto auto; gap: 8px 10px; align-items: center; }
.bl { display: grid; font-weight: 600; font-size: .92rem; min-width: 0; overflow-wrap: break-word; }
.bl small { font-weight: 500; font-size: .74rem; }
.bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--orange); border-radius: 6px; }
.bv { font-weight: 700; min-width: 5.2ch; text-align: right; font-size: .92rem; white-space: nowrap; }
.bn { min-width: 3.4ch; text-align: right; white-space: nowrap; }
@media (max-width: 380px) { .barrow { grid-template-columns: 1fr auto auto; } .barrow .bar { grid-column: 1 / -1; order: 5; } }

/* ---------- Registro rápido ---------- */
.quickbar { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 848px; margin-inline: auto; padding: 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px 8px; min-height: 0; }
.qgk { grid-column: 1 / -1; font-size: .74rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.qbtn { border: 2px solid transparent; border-radius: 14px; min-height: 64px; display: grid; place-items: center; align-content: center; gap: 0; cursor: pointer; font-weight: 800; font-size: .95rem; line-height: 1.1; padding: 4px 8px; touch-action: manipulation; }
.qbtn b { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; }
.qbtn.save { background: var(--green-bg); color: var(--green-ink); border-color: var(--green-ink); }
.qbtn.goal { background: var(--orange); color: #0b1f3a; }
.qbtn.more { background: var(--surface-2); color: var(--fg); border-color: var(--line); min-width: 62px; }
.qbtn.more span { font-size: 1.5rem; line-height: 1; }
.qbtn.more small { font-size: .68rem; font-weight: 700; }
.qbtn.off { grid-column: span 1; min-height: 52px; background: var(--surface-2); color: var(--fg); border-color: var(--blue, var(--line)); }
.qbtn.off b { font-size: 1.4rem; }
.qbtn.off[data-id="asistencia"] { grid-column: 2 / -1; }
.qbtn:active { transform: scale(.97); }
.has-quick main { padding-bottom: 282px; }
.has-quick .toast { bottom: calc(264px + env(safe-area-inset-bottom, 0px)); }

.brand-logo { width: 38px; height: 38px; flex: none; object-fit: contain; background: #fff; border-radius: 9px; padding: 3px; }
.clublogo { width: 84px; height: 84px; border-radius: 18px; flex: none; background: var(--navy-2); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; overflow: hidden; }
.clublogo img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 6px; box-sizing: border-box; }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

/* Plantel y goles por jugador */
.bignum{font-size:2.4rem;text-align:center;font-weight:800;letter-spacing:2px;min-height:68px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pickchip{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:8px 6px;border-radius:12px;border:2px solid var(--line,#27406b);background:transparent;color:inherit;font:inherit;cursor:pointer}
.pickchip b{font-size:1.5rem;color:var(--orange,#ff8a1f)}
.pickchip span{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.pickchip:active{background:rgba(255,138,31,.2)}
.sqhead,.sqin{display:grid;grid-template-columns:56px 1fr 1fr;gap:6px}
.sqrow .input{min-width:0;padding:10px 8px}
.sqrow .num{text-align:center}

.tab svg{width:22px;height:22px}
.tabs-in{padding-inline:2px}
.tab{font-size:.56rem;letter-spacing:-.2px;font-weight:600}
@media (min-width:480px){.tab{font-size:.72rem;letter-spacing:0}}

/* Sanciones */
.has-quick main{padding-bottom:350px}
.has-quick .toast{bottom:calc(332px + env(safe-area-inset-bottom,0px))}
.qsanc{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qs{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-weight:800;font-size:.8rem;padding:4px;cursor:pointer;touch-action:manipulation}
.qs:active{transform:scale(.97)}
.sdot{display:inline-block;width:14px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.35);vertical-align:-3px;flex:none}
.sdot.amarilla{background:#f6c90e}.sdot.roja{background:#d62828}.sdot.azul{background:#1d6fe0}
.sdot.exclusion{background:#fff;border:2px solid #0b1f3a;width:16px;height:16px;border-radius:50%;position:relative}
.sdot.exclusion::after{content:'2';position:absolute;inset:0;display:grid;place-items:center;font-size:.6rem;font-weight:900;color:#0b1f3a}
.scounts{display:flex;gap:10px;align-items:center}.scount{display:inline-flex;gap:4px;align-items:center;font-weight:800}
.pen{font-size:.85rem;font-weight:700;color:var(--orange)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:800;cursor:pointer}.seg button.on{background:var(--orange);color:#0b1f3a;border-color:var(--orange)}

/* Zona del gol recibido */
.goalzones{border-bottom:3px solid var(--fg);border-radius:8px;gap:10px;padding:12px}
.zbtn{display:grid;place-items:center;align-content:center;gap:2px;min-height:84px;padding:4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation}
.zbtn b{font-family:var(--f-display);font-size:2rem;line-height:1}
.zbtn small{font-size:.72rem;color:var(--muted)}
.zbtn:active{background:var(--orange);color:#0b1f3a;transform:scale(.97)}
.zbtn:active small{color:#0b1f3a}

/* Ranking */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rankrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.rank li.podium .rankrow{border-color:var(--orange)}
.place{display:grid;place-items:center;font-size:1.9rem;line-height:1;font-weight:800;color:var(--muted)}
.place.num{font-size:1.1rem}
.rname{display:grid;gap:2px;font-weight:800;min-width:0}.rname small{font-weight:600}
.rval{display:grid;justify-items:end}.rval b{font-family:var(--f-display);font-size:1.7rem;line-height:1}.rval small{color:var(--muted);font-size:.7rem}
.pbar{position:relative;height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--orange);opacity:.45;border-radius:8px}
.pbar span{position:relative;display:block;line-height:30px;padding:0 10px;font-weight:700;font-size:.85rem}
.prow{display:grid;gap:3px}


</style>

<body>

<header class="top" id="top"></header>
<main id="main">
  <div id="boot" class="empty"><h3>Cargando Arquero Handball 2.0</h3><p>Abriendo los datos guardados en este dispositivo.</p></div>
  <div id="view"></div>
</main>
<div id="fab"></div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg"></div>
  <section class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-label="Detalle"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>


<script>

/* HANDBALL GOALKEEPER PRO - lógica pura (sin DOM). Etapa 1. */
(function (root) {
  'use strict';

  var CATEGORIES = [
    { id: 'infa', name: 'Infantiles (INFA)' },
    { id: 'menores', name: 'Menores' },
    { id: 'cadetes', name: 'Cadetes' },
    { id: 'juveniles', name: 'Juveniles' },
    { id: 'juniors', name: 'Juniors' },
    { id: 'seniors', name: 'Seniors' },
    { id: 'plata', name: 'Liga de Plata' },
    { id: 'oro', name: 'Liga de Oro' },
    { id: 'seleccion', name: 'Selección Argentina' }
  ];
  var HANDS = [['derecha', 'Derecha'], ['izquierda', 'Izquierda'], ['ambidiestro', 'Ambidiestro']];
  var FED_STATUS = [['vigente', 'Vigente'], ['pendiente', 'Pendiente'], ['inactivo', 'Inactivo']];
  var RAMAS = [['femenino', 'Femenino'], ['masculino', 'Masculino'], ['mixto', 'Mixto']];
  var ROLES = [['titular', 'Titular'], ['suplente', 'Suplente']];

  function catName(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i].name;
    return id;
  }
  function labelOf(list, key) {
    for (var i = 0; i < list.length; i++) if (list[i][0] === key) return list[i][1];
    return key || '';
  }

  function uuid() {
    var c = root.crypto;
    if (c && typeof c.randomUUID === 'function') return c.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayISO(now) {
    var d = now || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return { y: y, m: mo, d: d };
  }

  /* Edad cumplida a la fecha indicada. Quien nace un 29/02 cumple años el 01/03 en años no bisiestos. */
  function ageOn(dob, today) {
    var b = parseDate(dob), t = parseDate(today);
    if (!b || !t) return null;
    var a = t.y - b.y;
    if (t.m < b.m || (t.m === b.m && t.d < b.d)) a--;
    return a < 0 ? null : a;
  }
  function isMinor(age) { return age !== null && age !== undefined && age < 18; }

  function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }

  function normalizePlayer(raw) {
    var p = {};
    p.firstName = clean(raw.firstName);
    p.lastName = clean(raw.lastName);
    p.nickname = clean(raw.nickname);
    p.photo = typeof raw.photo === 'string' && raw.photo.indexOf('data:image/') === 0 ? raw.photo : '';
    p.dob = clean(raw.dob);
    var j = clean(raw.jersey);
    p.jersey = j === '' ? null : Number(j);
    var h = clean(raw.heightCm);
    p.heightCm = h === '' ? null : Number(h);
    p.hand = clean(raw.hand);
    p.joinedAt = clean(raw.joinedAt);
    var seen = {}, cats = [];
    (raw.categories || []).forEach(function (c) {
      if (!seen[c] && CATEGORIES.some(function (k) { return k.id === c; })) { seen[c] = 1; cats.push(c); }
    });
    p.categories = cats;
    var rs = {}, roster = [];
    (raw.roster || []).forEach(function (r) {
      if (r && r.teamId && (r.role === 'titular' || r.role === 'suplente') && !rs[r.teamId]) { rs[r.teamId] = 1; roster.push({ teamId: r.teamId, role: r.role }); }
    });
    p.roster = roster;
    p.federated = !!raw.federated;
    if (p.federated) {
      p.federation = clean(raw.federation);
      p.fedClub = clean(raw.fedClub);
      p.license = clean(raw.license);
      p.fedSeason = clean(raw.fedSeason);
      p.fedStatus = clean(raw.fedStatus) || 'pendiente';
    } else {
      p.federation = ''; p.fedClub = ''; p.license = ''; p.fedSeason = ''; p.fedStatus = '';
    }
    return p;
  }

  function validatePlayer(p, today) {
    var e = {};
    if (!p.firstName) e.firstName = 'Ingresá el nombre.';
    else if (p.firstName.length > 60) e.firstName = 'El nombre es demasiado largo.';
    if (!p.lastName) e.lastName = 'Ingresá el apellido.';
    else if (p.lastName.length > 60) e.lastName = 'El apellido es demasiado largo.';
    if (p.nickname.length > 30) e.nickname = 'El apodo admite hasta 30 caracteres.';
    if (!p.dob) e.dob = 'Ingresá la fecha de nacimiento.';
    else if (!parseDate(p.dob)) e.dob = 'La fecha de nacimiento no es válida.';
    else if (p.dob > today) e.dob = 'La fecha de nacimiento no puede ser futura.';
    else if (p.dob < '1950-01-01') e.dob = 'Revisá el año de nacimiento.';
    if (p.jersey !== null && !(Number.isInteger(p.jersey) && p.jersey >= 0 && p.jersey <= 99)) e.jersey = 'El número va de 0 a 99.';
    if (p.heightCm !== null && !(Number.isFinite(p.heightCm) && p.heightCm >= 100 && p.heightCm <= 230)) e.heightCm = 'La altura va de 100 a 230 cm.';
    if (p.hand && !HANDS.some(function (h) { return h[0] === p.hand; })) e.hand = 'Elegí una opción válida.';
    if (p.joinedAt && !parseDate(p.joinedAt)) e.joinedAt = 'La fecha de incorporación no es válida.';
    if (p.federated) {
      if (!p.federation) e.federation = 'Indicá la federación o asociación.';
      if (!FED_STATUS.some(function (s) { return s[0] === p.fedStatus; })) e.fedStatus = 'Elegí el estado.';
      else if (p.fedStatus === 'vigente' && !p.license) e.license = 'Una licencia vigente necesita número de registro.';
    }
    return e;
  }

  var FED_FIELDS = [
    ['federation', 'Federación'], ['fedClub', 'Club federado'], ['license', 'Licencia'],
    ['fedSeason', 'Temporada'], ['fedStatus', 'Estado']
  ];

  /* Entradas de historial deportivo que produce un cambio de ficha. */
  function diffPlayer(oldP, newP, ctx) {
    ctx = ctx || {};
    var teamName = ctx.teamName || function (id) { return id; };
    var out = [];
    var fedShow = function (p, k) {
      var v = p[k] || '—';
      return k === 'fedStatus' ? labelOf(FED_STATUS, p[k]) || '—' : v;
    };
    if (!oldP) {
      out.push({ kind: 'alta', text: 'Alta en el club' });
      if (newP.categories.length) out.push({ kind: 'categoria', text: 'Categorías: ' + newP.categories.map(catName).join(', ') });
      if (newP.federated) out.push({ kind: 'federacion', text: 'Federado en ' + (newP.federation || '—') + (newP.fedClub ? ' por ' + newP.fedClub : '') + ' (' + labelOf(FED_STATUS, newP.fedStatus) + ')' });
      newP.roster.forEach(function (r) { out.push({ kind: 'plantel', text: labelOf(ROLES, r.role) + ' en ' + teamName(r.teamId) }); });
      return out;
    }
    newP.categories.forEach(function (c) { if (oldP.categories.indexOf(c) < 0) out.push({ kind: 'categoria', text: 'Categoría agregada: ' + catName(c) }); });
    oldP.categories.forEach(function (c) { if (newP.categories.indexOf(c) < 0) out.push({ kind: 'categoria', text: 'Categoría quitada: ' + catName(c) }); });

    if (oldP.federated !== newP.federated) {
      out.push({ kind: 'federacion', text: newP.federated ? 'Pasó a estar federado en ' + (newP.federation || '—') + ' (' + labelOf(FED_STATUS, newP.fedStatus) + ')' : 'Dejó de figurar como federado' });
    } else if (newP.federated) {
      var parts = [];
      FED_FIELDS.forEach(function (f) {
        if ((oldP[f[0]] || '') !== (newP[f[0]] || '')) parts.push(f[1] + ': ' + fedShow(oldP, f[0]) + ' → ' + fedShow(newP, f[0]));
      });
      if (parts.length) out.push({ kind: 'federacion', text: parts.join('; ') });
    }

    var oldR = {}, newR = {};
    oldP.roster.forEach(function (r) { oldR[r.teamId] = r.role; });
    newP.roster.forEach(function (r) { newR[r.teamId] = r.role; });
    Object.keys(newR).forEach(function (t) {
      if (!oldR[t]) out.push({ kind: 'plantel', text: 'Se sumó al plantel de ' + teamName(t) + ' como ' + labelOf(ROLES, newR[t]).toLowerCase() });
      else if (oldR[t] !== newR[t]) out.push({ kind: 'plantel', text: 'En ' + teamName(t) + ' pasó de ' + labelOf(ROLES, oldR[t]).toLowerCase() + ' a ' + labelOf(ROLES, newR[t]).toLowerCase() });
    });
    Object.keys(oldR).forEach(function (t) { if (!newR[t]) out.push({ kind: 'plantel', text: 'Salió del plantel de ' + teamName(t) }); });
    return out;
  }

  function fullName(p) { return p.firstName + ' ' + p.lastName; }
  function initials(p) { return ((p.firstName || '?')[0] + (p.lastName || '')[0]).toUpperCase(); }
  function sortPlayers(list) {
    return list.slice().sort(function (a, b) {
      return (a.lastName + ' ' + a.firstName).localeCompare(b.lastName + ' ' + b.firstName, 'es');
    });
  }

  function filterByClub(list, clubId) {
    return list.filter(function (x) { return x.clubId === clubId && !x.deleted; });
  }

  function rosterFor(players, teamId) {
    var res = { titular: [], suplente: [] };
    players.forEach(function (p) {
      if (p.deleted || p.active === false) return;
      (p.roster || []).forEach(function (r) { if (r.teamId === teamId) res[r.role].push(p); });
    });
    var byJersey = function (a, b) { return (a.jersey == null ? 999 : a.jersey) - (b.jersey == null ? 999 : b.jersey) || fullName(a).localeCompare(fullName(b), 'es'); };
    res.titular.sort(byJersey); res.suplente.sort(byJersey);
    return res;
  }

  function summary(players, teams, today) {
    var act = players.filter(function (p) { return !p.deleted && p.active !== false; });
    return {
      arqueros: act.length,
      equipos: teams.filter(function (t) { return !t.deleted; }).length,
      federadosVigentes: act.filter(function (p) { return p.federated && p.fedStatus === 'vigente'; }).length,
      menores: act.filter(function (p) { return isMinor(ageOn(p.dob, today)); }).length
    };
  }

  /* Fusión por id: gana la versión con updatedAt más reciente (base para la sincronización futura). */
  function mergeRecords(local, incoming) {
    var map = {}; var res = { list: [], added: 0, updated: 0, kept: 0 };
    local.forEach(function (r) { map[r.id] = r; });
    incoming.forEach(function (r) {
      var cur = map[r.id];
      if (!cur) { map[r.id] = r; res.added++; }
      else if ((r.updatedAt || '') > (cur.updatedAt || '')) { map[r.id] = r; res.updated++; }
      else res.kept++;
    });
    res.list = Object.keys(map).map(function (k) { return map[k]; });
    return res;
  }

  var BACKUP_STORES = ['clubs', 'seasons', 'teams', 'players', 'history'];
  /* Almacenes agregados después de la Etapa 1: opcionales al restaurar para aceptar copias antiguas. */
  var OPTIONAL_STORES = ['tournaments', 'matches', 'shots', 'changes', 'plays', 'squad', 'goals', 'sanctions'];
  var ALL_STORES = BACKUP_STORES.concat(OPTIONAL_STORES);

  function buildBackup(state, clubId, now) {
    var data = { app: 'handball-goalkeeper-pro', version: 1, exportedAt: (now || new Date()).toISOString(), clubId: clubId };
    ALL_STORES.forEach(function (s) {
      data[s] = (state[s] || []).filter(function (r) { return s === 'clubs' ? r.id === clubId : r.clubId === clubId; });
    });
    return JSON.stringify(data);
  }

  function parseBackup(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { return { ok: false, error: 'El texto no es una copia válida (no se pudo leer).' }; }
    if (!d || d.app !== 'handball-goalkeeper-pro') return { ok: false, error: 'Esta copia no pertenece a esta aplicación.' };
    if (d.version !== 1) return { ok: false, error: 'La versión de la copia no es compatible.' };
    for (var i = 0; i < ALL_STORES.length; i++) {
      var s = ALL_STORES[i];
      if (d[s] === undefined && OPTIONAL_STORES.indexOf(s) >= 0) d[s] = [];
      if (!Array.isArray(d[s])) return { ok: false, error: 'La copia está incompleta (falta ' + s + ').' };
      for (var k = 0; k < d[s].length; k++) {
        if (!d[s][k] || typeof d[s][k].id !== 'string') return { ok: false, error: 'La copia contiene registros dañados.' };
      }
    }
    return { ok: true, data: d };
  }

  /* Datos de ejemplo ficticios. */
  function seedDemo(nowISO) {
    var t = nowISO || new Date().toISOString();
    var club = { id: 'demo-club', name: 'Club Demo Handball', shortName: 'CDH', city: 'Ciudad de ejemplo', demo: true, createdAt: t, updatedAt: t };
    var season = { id: 'demo-s2026', clubId: club.id, name: '2026', demo: true, createdAt: t, updatedAt: t };
    var mk = function (id, name, cat, rama, coach) {
      return { id: id, clubId: club.id, seasonId: season.id, name: name, category: cat, rama: rama, coach: coach, assistant: '', demo: true, createdAt: t, updatedAt: t };
    };
    var teams = [
      mk('demo-t1', 'Primera Masculino', 'seniors', 'masculino', 'Prof. Ejemplo Uno'),
      mk('demo-t2', 'Cadetes Femenino', 'cadetes', 'femenino', 'Prof. Ejemplo Dos'),
      mk('demo-t3', 'Menores Mixto', 'menores', 'mixto', 'Prof. Ejemplo Tres')
    ];
    var base = { clubId: club.id, active: true, deleted: false, demo: true, createdAt: t, updatedAt: t, photo: '' };
    var players = [
      Object.assign({}, base, { id: 'demo-p1', firstName: 'Matías', lastName: 'Ferreyra', nickname: 'Gato', dob: '2001-03-14', jersey: 1, heightCm: 192, hand: 'derecha', joinedAt: '2019-02-01', categories: ['seniors', 'plata'], roster: [{ teamId: 'demo-t1', role: 'titular' }], federated: true, federation: 'FEMEBAL', fedClub: 'Club Demo Handball', license: 'DEMO-0001', fedSeason: '2026', fedStatus: 'vigente' }),
      Object.assign({}, base, { id: 'demo-p2', firstName: 'Lucía', lastName: 'Benítez', nickname: 'Lu', dob: '2010-05-20', jersey: 16, heightCm: 171, hand: 'izquierda', joinedAt: '2022-03-10', categories: ['cadetes', 'juveniles'], roster: [{ teamId: 'demo-t2', role: 'titular' }], federated: true, federation: 'FEMEBAL', fedClub: 'Club Aliado Ejemplo', license: 'DEMO-0002', fedSeason: '2026', fedStatus: 'vigente' }),
      Object.assign({}, base, { id: 'demo-p3', firstName: 'Tomás', lastName: 'Giménez', nickname: '', dob: '2013-09-09', jersey: 12, heightCm: 158, hand: 'derecha', joinedAt: '2024-04-05', categories: ['infa', 'menores'], roster: [{ teamId: 'demo-t3', role: 'suplente' }], federated: false, federation: '', fedClub: '', license: '', fedSeason: '', fedStatus: '' }),
      Object.assign({}, base, { id: 'demo-p4', firstName: 'Sofía', lastName: 'Aguirre', nickname: 'Sofi', dob: '2009-11-30', jersey: 1, heightCm: 168, hand: 'derecha', joinedAt: '2023-02-15', categories: ['cadetes'], roster: [{ teamId: 'demo-t2', role: 'suplente' }], federated: true, federation: 'FEMEBAL', fedClub: 'Club Demo Handball', license: '', fedSeason: '2026', fedStatus: 'pendiente' })
    ];
    var history = [];
    var tn = function (id) { return teams.filter(function (x) { return x.id === id; })[0].name; };
    players.forEach(function (p) {
      diffPlayer(null, p, { teamName: tn }).forEach(function (h, i) {
        history.push({ id: 'demo-h-' + p.id + '-' + i, clubId: club.id, playerId: p.id, kind: h.kind, text: h.text, date: p.joinedAt, at: p.joinedAt + 'T12:00:00.000Z', demo: true, createdAt: t, updatedAt: t });
      });
    });
    return { club: club, seasons: [season], teams: teams, players: players, history: history };
  }

  /* ================= Etapa 2: partidos y lanzamientos ================= */
  var ORIGINS = [['6m', '6 metros'], ['9m', '9 metros'], ['extremo_izq', 'Extremo izquierdo'], ['extremo_der', 'Extremo derecho'], ['pivote', 'Pivote'], ['penal', 'Penal'], ['contraataque', 'Contraataque'], ['otras', 'Otras situaciones']];
  var RESULTS = [['atajada', 'Atajada'], ['gol', 'Gol recibido'], ['desviado', 'Lanzamiento desviado'], ['poste', 'Lanzamiento al poste'], ['bloqueo', 'Bloqueo defensivo']];
  /* Los códigos internos se conservan para no perder lanzamientos ya cargados; solo cambian los nombres que se ven. */
  var SHOT_TYPES = [['suspension', 'Suspendido'], ['apoyo', 'A Pie Firme'], ['rosca', 'Rosca'], ['vaselina', 'A Tendido'], ['directo', 'Lanzamiento directo'], ['rectificado', 'Rectificado'], ['fly', 'Fly'], ['con_caida', 'Con Caída'], ['penal', 'Penal'], ['otros', 'Otros']];
  /* Zonas 1 a 9, de izquierda a derecha y de arriba hacia abajo, vistas desde el lanzador (de frente al arco). */
  var ZONES = ['Superior izquierdo', 'Superior central', 'Superior derecho', 'Medio izquierdo', 'Medio central', 'Medio derecho', 'Inferior izquierdo', 'Inferior central', 'Inferior derecho'];
  /* Sectores de cancha para estimar distancia; el valor es una distancia representativa en metros. */
  var DIST_SECTORS = [['area', 'Dentro de 6 m', 6], ['media', 'De 6 a 9 m', 7.5], ['exterior', 'De 9 a 12 m', 10.5], ['lejana', 'Más de 12 m', 13], ['penal', 'Penal (7 m)', 7]];
  var ORIGIN_DISTANCE = { '6m': 6, '9m': 9, penal: 7, pivote: 6, extremo_izq: 7, extremo_der: 7 };
  var PERIODS = [['1T', '1.er tiempo'], ['2T', '2.º tiempo'], ['P1', 'Prórroga 1'], ['P2', 'Prórroga 2']];

<script>

/* HANDBALL GOALKEEPER PRO - Etapa 1: clubes, equipos, categorías, arqueros y federaciones. */
(function () {
  'use strict';
  const H = window.HGP;
  const STORES = ['clubs', 'teams', 'seasons', 'players', 'history', 'tournaments', 'matches', 'shots', 'changes', 'plays', 'squad', 'goals', 'sanctions', 'settings'];
  const S = { clubs: [], teams: [], seasons: [], players: [], history: [], tournaments: [], matches: [], shots: [], changes: [], plays: [], squad: [], goals: [], sanctions: [], settings: {} };
  const ui = { tab: 'inicio', clubId: null, q: '', cat: '', confirm: '', backup: '', importMsg: '', newClub: false, matchId: null, shotCtx: null, changeCtx: null };
  let db = null;

  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (s) => { const d = H.parseDate(s); return d ? String(d.d).padStart(2, '0') + '/' + String(d.m).padStart(2, '0') + '/' + d.y : '—'; };
  const today = () => H.todayISO();

  /* ---------- Almacenamiento (IndexedDB) ---------- */
  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('sin indexedDB'));
      let r;
      try { r = indexedDB.open('hgp-v1', 5); } catch (e) { return reject(e); }
      r.onupgradeneeded = () => { STORES.forEach((s) => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.onblocked = () => reject(new Error('bloqueado'));
    });
  }
  const idbAll = (store) => new Promise((res, rej) => { const q = db.transaction(store, 'readonly').objectStore(store).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  const idbPut = (store, obj) => new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(obj); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

  function persist(store, obj) {
    if (!db) return Promise.resolve();
    return idbPut(store, obj).catch(() => { persistent = false; toast('No se pudo guardar en este dispositivo.'); });
  }
  function save(store, obj) {
    const now = new Date().toISOString();
    if (!obj.createdAt) obj.createdAt = now;
    obj.updatedAt = now;
    if (store === 'settings') S.settings[obj.id] = obj;
    else {
      const l = S[store]; const i = l.findIndex((x) => x.id === obj.id);
      if (i < 0) l.push(obj); else l[i] = obj;
    }
    return persist(store, obj);
  }

  /* ---------- Consultas ---------- */
  const clubs = () => S.clubs.filter((c) => !c.deleted);
  const club = () => clubs().find((c) => c.id === ui.clubId) || null;
  const players = () => H.filterByClub(S.players, ui.clubId);
  const teams = () => H.filterByClub(S.teams, ui.clubId);
  const seasons = () => H.filterByClub(S.seasons, ui.clubId).sort((a, b) => b.name.localeCompare(a.name));
  const teamById = (id) => S.teams.find((t) => t.id === id);
  const teamName = (id) => { const t = teamById(id); return t ? t.name : 'equipo eliminado'; };
  const seasonName = (id) => { const s = S.seasons.find((x) => x.id === id); return s ? s.name : '—'; };
  const playerById = (id) => S.players.find((p) => p.id === id && !p.deleted);
  const hasDemo = () => H.ALL_STORES.some((k) => S[k].some((r) => r.demo));

  /* ---------- Interfaz base ---------- */
  let toastTimer = null;
  function toast(msg) {

  }
  const ICONS = {
    estadisticas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
    partidos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2.5"/><path d="M9.5 2.5h5"/></svg>',
    inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    jugadores: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3.5L3 6l2 4.5 2.5-1V20.5h9V9.5l2.5 1L21 6l-5.5-2.5a3.5 3.5 0 01-7 0z"/></svg>',

    club: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>'
  };
  const TABS = [['inicio', 'Inicio'], ['partidos', 'Partidos'], ['estadisticas', 'Stats', 'Estadísticas'], ['arqueros', 'Arqueros'], ['jugadores', 'Jugadores'], ['equipos', 'Equipos'], ['club', 'Club']];

  const logoOf = (c) => (c && typeof c.logo === 'string' && c.logo.indexOf('data:image/') === 0 ? c.logo : '');
  function render() {
    const c = club();
    const cl = clubs();
    const sel = cl.length > 1
      ? `<select class="clubsel" data-role="clubsel" aria-label="Club activo">${cl.map((x) => `<option value="${esc(x.id)}"${x.id === ui.clubId ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : '';
    $('#top').innerHTML = `<div class="top-in">${logoOf(c) ? `<img class="brand-logo" src="${esc(logoOf(c))}" alt="Logo de ${esc(c.name)}">` : ''}<div class="brand">Arquero <b>Handball</b> 2.0<small>Estadística y productividad</small><small class="clubline">${c ? esc(c.name) : 'Sin club'}</small></div>${sel}</div>`;
    $('#tabs').innerHTML = `<div class="tabs-in">${TABS.map((t) => `<button class="tab" data-act="tab" data-id="${t[0]}"${t[2] ? ` aria-label="${t[2]}"` : ''}${ui.tab === t[0] ? ' aria-current="page"' : ''}>${ICONS[t[0]]}<span>${t[1]}</span></button>`).join('')}</div>`;

  function fedPill(p) {

  function emptyClub() {

  function playerCard(p) {

          <div class="${fcls(errors, 'nickname')}"><label for="f-nick">Apodo (opcional)</label><input class="input" id="f-nick" name="nickname" value="${esc(p.nickname)}" maxlength="30">${fieldErr(errors, 'nickname')}</div>
          <div class="${fcls(errors, 'dob')}"><label for="f-dob">Fecha de nacimiento</label><input class="input" type="date" id="f-dob" name="dob" value="${esc(p.dob)}">${fieldErr(errors, 'dob')}</div>

          <div class="${fcls(errors, 'joinedAt')}"><label for="f-join">Incorporación al club</label><input class="input" type="date" id="f-join" name="joinedAt" value="${esc(p.joinedAt)}">${fieldErr(errors, 'joinedAt')}</div>
        </div>
        ${sq ? `<div class="field"><label for="sq-p">Posición (opcional)</label><select class="input" id="sq-p" name="position">${options(H.POSITIONS, p.position, 'Sin indicar')}</select></div>` : ''}
        <div class="field"><span class="lbl">Categorías (puede jugar en más de una)</span><div class="chips">${H.CATEGORIES.map((c) => `<label class="chip"><input type="checkbox" name="cat" value="${c.id}"${(p.categories || []).indexOf(c.id) >= 0 ? ' checked' : ''}><span>${esc(c.name)}</span></label>`).join('')}</div></div>
      </fieldset>
      ${sq ? '' : `<fieldset><legend>Planteles</legend>
        ${tm.length ? tm.map((t) => `<div class="rosterrow"><label for="r-${esc(t.id)}">${esc(t.name)}<span class="muted small"> · ${esc(seasonName(t.seasonId))}</span></label><select class="input" id="r-${esc(t.id)}" name="roster-${esc(t.id)}">${options(H.ROLES, rosterOf[t.id], 'No integra')}</select></div>`).join('') : '<div class="muted small">Todavía no hay equipos. Creá uno en la pestaña Equipos para asignarlo.</div>'}
      </fieldset>`}
      <fieldset><legend>Situación federativa</legend>

        <div class="stack" id="fed-fields"${p.federated ? '' : ' hidden'}>
          <div class="${fcls(errors, 'federation')}"><label for="f-fedn">Federación o asociación</label><input class="input" id="f-fedn" name="federation" list="feds" value="${esc(p.federation)}" maxlength="80"><datalist id="feds"><option value="FEMEBAL"></option></datalist>${fieldErr(errors, 'federation')}</div>
          <div class="field"><label for="f-fedc">Club por el que está federado</label><input class="input" id="f-fedc" name="fedClub" value="${esc(p.fedClub)}" maxlength="80"><span class="muted small">Puede ser distinto del club donde juega.</span></div>
          <div class="grid2">

  function readPlayerForm(form) {
    const fd = new FormData(form);
    const raw = {
      firstName: fd.get('firstName'), lastName: fd.get('lastName'), nickname: fd.get('nickname'), photo: fd.get('photo'), dob: fd.get('dob'),
      jersey: fd.get('jersey'), heightCm: fd.get('heightCm'), hand: fd.get('hand'), joinedAt: fd.get('joinedAt'), categories: fd.getAll('cat'), roster: [],
      federated: fd.get('federated') === 'on', federation: fd.get('federation'), fedClub: fd.get('fedClub'), license: fd.get('license'), fedSeason: fd.get('fedSeason'), fedStatus: fd.get('fedStatus')
    };
    raw.position = fd.get('position');
    teams().forEach((t) => { const r = fd.get('roster-' + t.id); if (r) raw.roster.push({ teamId: t.id, role: r }); });
    return raw;
  }
  const blankPlayer = () => ({ firstName: '', lastName: '', nickname: '', photo: '', dob: '', jersey: null, heightCm: null, hand: '', joinedAt: today(), categories: [], roster: [], federated: false, federation: '', fedClub: '', license: '', fedSeason: '', fedStatus: 'pendiente' });

  function submitPlayer(form) {
    const id = form.getAttribute('data-id');
    const p = H.normalizePlayer(readPlayerForm(form));
    const errors = H.validatePlayer(p, today());
    if (Object.keys(errors).length) { openSheet(playerForm(p, errors, id)); const f = $('.field.err .input', $('#sheet-panel')); if (f) f.focus(); return; }
    const old = id ? playerById(id) : null;
    const entries = H.diffPlayer(old ? H.normalizePlayer(old) : null, p, { teamName });
    const rec = Object.assign({}, old || { id: H.uuid(), clubId: ui.clubId, active: true, deleted: false }, p);
    const t = today(); const at = new Date().toISOString();
    const jobs = [save('players', rec)].concat(entries.map((e) => save('history', { id: H.uuid(), clubId: ui.clubId, playerId: rec.id, kind: e.kind, text: e.text, date: t, at })));
    Promise.all(jobs).then(() => { toast(old ? 'Ficha actualizada' : 'Arquero guardado'); render(); openPlayer(rec.id); });
  }

  /* ---------- Plantel de jugadores de campo ---------- */

  /* Cada asistencia con compañero indicado cuenta como gol de ese jugador. */
  const assistGoals = () => S.plays.filter((p) => p.kind === 'asistencia' && !p.deleted && (p.receiverId || (p.receiverJersey !== null && p.receiverJersey !== undefined))).map((p) => ({ id: 'as-' + p.id, clubId: p.clubId, matchId: p.matchId, teamId: (S.matches.find((m) => m.id === p.matchId) || {}).teamId, playerId: p.receiverId || null, jersey: p.receiverJersey === undefined ? null : p.receiverJersey, period: p.period, t: p.t, deleted: false }));

  function doDemoDelete() {
    const jobs = [];

    const isDemo = (r) => r.demo || demoClubs.indexOf(r.clubId) >= 0;
    H.ALL_STORES.forEach((s) => {
      S[s].filter(isDemo).forEach((r) => { jobs.push(db ? new Promise((res) => { const t = db.transaction(s, 'readwrite'); t.objectStore(s).delete(r.id); t.oncomplete = res; t.onerror = res; t.onabort = res; }) : Promise.resolve()); });
      S[s] = S[s].filter((r) => !isDemo(r));
    });
    Promise.all(jobs).then(() => {
      if (!club()) { const f = clubs()[0]; ui.clubId = f ? f.id : null; }
      ui.confirm = ''; toast('Datos de ejemplo borrados'); render();
    });

  function doRestore(text) {
    const r = H.parseBackup(text);
    if (!r.ok) { ui.importMsg = r.error; render(); return; }
    const jobs = []; let added = 0, updated = 0;
    H.ALL_STORES.forEach((s) => {
      const m = H.mergeRecords(S[s], r.data[s]);
      added += m.added; updated += m.updated;
      const incoming = {}; r.data[s].forEach((x) => { incoming[x.id] = x; });
      m.list.forEach((x) => { if (incoming[x.id] === x) jobs.push(persist(s, x)); });
      S[s] = m.list;
    });
    Promise.all(jobs).then(() => {
      if (!club()) { const f = clubs()[0]; ui.clubId = f ? f.id : null; }
      ui.importMsg = 'Copia restaurada: ' + added + ' registros nuevos, ' + updated + ' actualizados.'; render();
    });
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) pageAway = true; });
  document.addEventListener('click', (ev) => {
    const t = ev.target; if (!t || t.type !== 'file' || FILE_IDS.indexOf(t.id) < 0) return;
    pageAway = false; clearTimeout(pickHint);
    pickHint = setTimeout(() => { if (!pageAway) toast('El selector de fotos no se abrió. En la vista previa de Claude puede estar bloqueado; con la app instalada debería funcionar.'); }, 2500);
  }, true);
  function onFilePicked(t) {
    clearTimeout(pickHint);
    const file = t.files && t.files[0]; if (!file || t._busy) return;
    t._busy = true;
    const done = () => { t._busy = false; try { t.value = ''; } catch (e) { /* nada */ } };
    const fail = () => { toast(file.size > 15 * 1024 * 1024 ? 'La imagen pesa más de 15 MB. Elegí otra.' : 'No se pudo leer esa imagen. Probá con otra (JPG o PNG).'); done(); };
    toast('Procesando imagen…');
    if (t.id === 'club-file') {
      const cl = S.clubs.find((x) => x.id === t.getAttribute('data-id')); if (!cl) return done();
      resizeLogo(file, (url) => { if (!url) return fail(); save('clubs', Object.assign({}, cl, { logo: url })).then(() => { toast('Logo guardado'); done(); render(); }); });
    } else if (t.id === 'p-file') {
      const pl = playerById(t.getAttribute('data-id')); if (!pl) return done();
      resizePhoto(file, (url) => { if (!url) return fail(); save('players', Object.assign({}, pl, { photo: url })).then(() => { toast('Foto guardada'); done(); render(); openPlayer(pl.id); }); });
    } else {
      resizePhoto(file, (url) => {
        if (!url) return fail();
        $('#f-photo').value = url;
        const nm = $('#f-first').value || '?', ln = $('#f-last').value || '';
        $('#photo-prev').innerHTML = avatar({ firstName: nm, lastName: ln, photo: url }, true); toast('Foto lista'); done();
      });
    }
  }
  /* Logo del club: se conserva la proporción (sin recortar) y la transparencia; máximo 256 px. */
  function resizeLogo(file, cb) {
    if (!file || file.size > 15 * 1024 * 1024) return cb(null);
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 256, k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
        let url = c.toDataURL('image/png');
        if (url.length > 220000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); url = c.toDataURL('image/jpeg', 0.85); }
        cb(url);
      };
      img.onerror = () => cb(null); img.src = fr.result;
    };
    fr.onerror = () => cb(null); fr.readAsDataURL(file);
  }
  function resizePhoto(file, cb) {
    if (!file || file.size > 15 * 1024 * 1024) return cb(null);
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => cb(null); img.src = fr.result;
    };
    fr.onerror = () => cb(null); fr.readAsDataURL(file);
  }

  /* ---------- Etapa 2: partidos y lanzamientos ---------- */
  const pAny = (id) => S.players.find((p) => p.id === id);
  const matches = () => H.filterByClub(S.matches, ui.clubId);
  const matchById = (id) => S.matches.find((m) => m.id === id && !m.deleted);
  const shotsOf = (mid) => S.shots.filter((s) => s.matchId === mid && !s.deleted);
  const playsOf = (mid) => S.plays.filter((p) => p.matchId === mid && !p.deleted);
  const changesOf = (mid) => S.changes.filter((c) => c.matchId === mid && !c.deleted);
  const tournaments = () => H.filterByClub(S.tournaments, ui.clubId);
  const tournamentName = (id) => { const t = S.tournaments.find((x) => x.id === id); return t ? t.name : ''; };
  const gkLabel = (id) => { const p = pAny(id); return p ? H.fullName(p) + (p.jersey != null ? ' (#' + p.jersey + ')' : '') : 'arquero eliminado'; };
  const dec = (n) => String(n).replace('.', ',');
  const mmss = (sec) => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  const periodLabel = (id) => H.labelOf(H.PERIODS, id);

  let wake = null;
  function syncWake(on) {
    try {
      if (on && !wake && navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { wake = l; l.addEventListener('release', () => { wake = null; }); }).catch(() => {});
      else if (!on && wake) { wake.release().catch(() => {}); wake = null; }
    } catch (e) { /* sin wake lock */ }
  }

  function statusPill(m) {
    const cls = m.status === 'en_juego' ? 'ok' : m.status === 'pausado' ? 'warn' : '';
    return `<span class="pill ${cls}">${esc(H.labelOf(H.STATUSES, m.status))}</span>`;
  }
  function liveBanner() {
    const m = matches().find((x) => x.status === 'en_juego' || x.status === 'pausado');
    if (!m) return '';
    return `<button class="card tap" data-act="match" data-id="${esc(m.id)}" style="border-color:var(--orange)"><div class="grow"><div class="eyebrow">Partido en curso</div><div class="name">${esc(teamName(m.teamId))} vs ${esc(m.rival)}</div></div><span class="pill ${m.status === 'en_juego' ? 'ok' : 'warn'}">${esc(H.labelOf(H.STATUSES, m.status))}</span></button>`;
  }

  function matchCard(m) {
    const team = teamById(m.teamId);
    const tn = team ? team.name : 'equipo eliminado';
    const home = m.isHome ? tn : m.rival, away = m.isHome ? m.rival : tn;
    const hs = m.isHome ? m.scoreUs : m.scoreThem, as = m.isHome ? m.scoreThem : m.scoreUs;
    const mid = m.status === 'programado' ? 'vs' : hs + ' – ' + as;
    const tour = tournamentName(m.tournamentId);
    return `<button class="card tap" data-act="match" data-id="${esc(m.id)}"><div class="grow stack" style="gap:6px">
      <div class="muted small num">${fmtDate(m.date)}${m.time ? ' · ' + esc(m.time) : ''}${tour ? ' · ' + esc(tour) : ''}</div>
      <div class="name">${esc(home)} <span class="num" style="color:var(--orange)">${mid}</span> ${esc(away)}</div>
      <div class="pills">${statusPill(m)}${team ? `<span class="pill cat">${esc(H.catName(team.category))}</span>` : ''}</div>
    </div></button>`;
  }

  function viewPartidos() {
    if (!club()) return emptyClub();
    const all = matches();
    const key = (m) => m.date + (m.time || '');
    const live = all.filter((m) => m.status === 'en_juego' || m.status === 'pausado');
    const next = all.filter((m) => m.status === 'programado').sort((a, b) => key(a).localeCompare(key(b)));
    const done = all.filter((m) => m.status === 'finalizado').sort((a, b) => key(b).localeCompare(key(a)));
    const group = (title, list) => (list.length ? `<div class="sec-head"><h3>${title}</h3></div>${list.map(matchCard).join('')}` : '');
    return `<div class="stack"><div class="sec-head"><h2>Partidos</h2><span class="muted small">${all.length} ${all.length === 1 ? 'partido' : 'partidos'}</span></div>
      ${all.length ? group('En curso', live) + group('Próximos', next) + group('Jugados', done) : '<div class="card empty"><h3>Todavía no hay partidos</h3><p>Creá el primero, convocá a los arqueros y empezá a registrar lanzamientos.</p></div>'}
    </div>`;
  }

  function summaryCard(title, s, badge) {
    return `<div class="card stack" style="gap:8px">
      <div class="row between"><div class="name">${esc(title)}</div>${badge || ''}</div>
      <div class="stats3">
        <div class="stat"><b class="num">${s.atajadas}</b><span class="muted small">Atajadas</span></div>
        <div class="stat"><b class="num">${s.goles}</b><span class="muted small">Goles recibidos</span></div>
        <div class="stat"><b class="num">${H.formatPct(s.efectividad)}</b><span class="muted small">Efectividad</span></div>
      </div>
      <div class="muted small num">${s.alArco} al arco · ${s.desviados} desviados · ${s.postes} al poste · ${s.bloqueos} bloqueados</div>
    </div>`;
  }

  function shotText(s) {
    const parts = [s.origin ? H.labelOf(H.ORIGINS, s.origin) : 'Sin detallar'];
    if (s.type) parts.push(H.labelOf(H.SHOT_TYPES, s.type).toLowerCase());
    if (s.zone) parts.push('zona ' + s.zone + ' (' + H.ZONES[s.zone - 1].toLowerCase() + ')');
    if (s.distance != null) parts.push(dec(s.distance) + ' m ' + (s.distanceSource === 'medida' ? 'medidos' : 'estimados'));
    return parts.join(' · ');
  }

  function viewMatch() {
    const m = matchById(ui.matchId);
    if (!m) { ui.matchId = null; return viewPartidos(); }
    const team = teamById(m.teamId);
    const shots = shotsOf(m.id), changes = changesOf(m.id);
    const rec = H.canRecord(m);
    const idx = H.periodIndex(m.period);
    const live = m.status === 'en_juego';
    const sumAll = H.defensiveSummary(shots);
    const nextP = H.canAdvancePeriod(m) ? H.PERIODS[idx + 1][1] : '';
    let ctl;
    if (m.status === 'programado') ctl = '<button class="btn orange block" data-act="mBegin">Iniciar partido</button>';
    else if (m.status === 'finalizado') ctl = '<button class="btn ghost block" data-act="mReopen">Reabrir registro</button>';
    else {
      ctl = `<div class="ctl-row">${live ? '<button class="btn block" data-act="mPause">Pausar</button>' : '<button class="btn orange block" data-act="mResume">Reanudar</button>'}${nextP ? `<button class="btn ghost block" data-act="mAdvance">Pasar a ${esc(nextP.toLowerCase())}</button>` : ''}</div>`
        + (ui.confirm === 'fin-' + m.id
          ? '<div class="row"><span class="small" style="font-weight:600">¿Finalizar el partido?</span><button class="btn danger sm" data-act="mDoFinish">Sí, finalizar</button><button class="btn ghost sm" data-act="cancel">No</button></div>'
          : '<button class="btn ghost block" data-act="mAskFinish">Finalizar partido</button>');
    }
    const plays = playsOf(m.id);
    const goals = goalsOf(m.id);
    const sancs = sancOf(m.id);
    const goalsAll = goals.concat(assistGoals().filter((g) => g.matchId === m.id));
    const events = shots.map((o) => ({ k: 's', o })).concat(changes.map((o) => ({ k: 'c', o })), plays.map((o) => ({ k: 'p', o })), goals.map((o) => ({ k: 'g', o })), sancs.map((o) => ({ k: 'z', o })));
    const evKey = (e) => H.periodIndex(e.o.period) * 100000 + e.o.t;
    events.sort((a, b) => evKey(b) - evKey(a) || (b.o.createdAt || '').localeCompare(a.o.createdAt || ''));
    const lastChange = changes.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];
    const evHtml = events.map((e) => {
      if (e.k === 's') {
        const s = e.o; const cls = s.result === 'atajada' ? 'ok' : s.result === 'gol' ? 'warn' : '';
        return `<li><button class="evt" data-act="editShot" data-id="${esc(s.id)}"><span class="small muted num">${mmss(s.t)} · ${esc(s.period)} · ${esc(gkLabel(s.gkId))}</span><span><span class="pill ${cls}">${esc(H.labelOf(H.RESULTS, s.result))}</span> ${esc(shotText(s))}</span></button></li>`;
      }
      if (e.k === 'z') { const z = e.o; return `<li><button class="evt" data-act="sancDetail" data-id="${esc(z.id)}"><span class="small muted num">${mmss(z.t)} · ${esc(z.period)}</span><span><span class="sdot ${z.kind}" aria-hidden="true"></span> <b>${esc(H.sanctionShort(z.kind))}</b> · ${esc(sideName(z.side))} · ${esc(sancWho(z))}${z.auto ? ' (automática)' : ''}${z.reason ? ' · ' + esc(z.reason) : ''}${z.combo ? ' · 4 min' : ''}</span></button></li>`; }
      if (e.k === 'g') { const g = e.o; return `<li><div class="evt static"><span class="small muted num">${mmss(g.t)} · ${esc(g.period)}</span><span><span class="pill ok">Gol nuestro</span> ${esc(goalLabel(g))}</span></div></li>`; }
      if (e.k === 'p') { const p = e.o; return `<li><div class="evt static"><span class="small muted num">${mmss(p.t)} · ${esc(p.period)} · ${esc(gkLabel(p.gkId))}</span><span><span class="pill ok">${esc(playName(p.kind))}</span>${p.kind === 'asistencia' && recvLabel(p) ? ' → ' + esc(recvLabel(p)) : ''}</span></div></li>`; }
      const c = e.o;
      const undo = rec && lastChange && lastChange.id === c.id && H.canUndoChange(c, shots) ? `<button class="btn ghost sm" data-act="undoChange" data-id="${esc(c.id)}">Deshacer</button>` : '';
      return `<li><div class="evt static"><span class="small muted num">${mmss(c.t)} · ${esc(c.period)}</span><span><span class="pill">Cambio</span> Sale ${esc(gkLabel(c.gkOutId))}, entra ${esc(gkLabel(c.gkInId))}</span>${undo}</div></li>`;
    }).join('');
    const tour = tournamentName(m.tournamentId);
    return `<div class="stack">
      <div class="row between"><button class="btn ghost sm" data-act="matchBack">← Partidos</button><div class="pills">${statusPill(m)}</div></div>
      <div><div class="eyebrow">${fmtDate(m.date)}${m.time ? ' · ' + esc(m.time) : ''}${tour ? ' · ' + esc(tour) : ''}</div><h2>${esc(team ? team.name : 'Equipo')} vs ${esc(m.rival)}</h2><div class="muted small">${m.isHome ? 'Local' : 'Visitante'}${m.venue ? ' · ' + esc(m.venue) : ''}</div></div>
      <div class="card stack" style="text-align:center">
        <div class="eyebrow">${esc(periodLabel(m.period))}</div>
        <div class="clock num" id="clock" aria-label="Tiempo que falta">${H.formatClock(H.periodLeftMs(m, Date.now()))}</div><div class="muted small">Cuenta regresiva · tiempo de ${(m.periodMinutes || [30])[Math.max(0, H.periodIndex(m.period))]} min</div>
        <div><span class="pill warn" id="timeover" hidden>Tiempo cumplido</span></div>
        <div class="scores">
          <div class="side"><div class="eyebrow">${esc(team ? team.name : 'Nosotros')}</div><div class="score num" id="scoreUs">${m.scoreUs}</div>
            <div class="row" style="justify-content:center"><button class="btn ghost sm" data-act="scoreDown"${rec && m.scoreUs > 0 ? '' : ' disabled'} aria-label="Restar un gol a nuestro equipo">−1</button><button class="btn sm" data-act="scoreUp"${rec ? '' : ' disabled'} aria-label="Sumar un gol a nuestro equipo">+1 gol</button></div></div>
          <div class="side"><div class="eyebrow">${esc(m.rival)}</div><div class="score num" id="scoreThem">${m.scoreThem}</div><div class="muted small">Se suma al cargar un gol recibido</div></div>
        </div>
        ${ctl}
      </div>
      <div class="card row between"><div class="grow"><div class="eyebrow">Arquero en cancha</div><div class="name">${esc(gkLabel(m.currentGk))}</div></div><button class="btn ghost sm" data-act="newChange"${rec && m.convocados.length > 1 ? '' : ' disabled'}>Cambio de arquero</button></div>
      ${lastShotCard(m, shots)}
      <div class="sec-head"><h3>Rendimiento del partido</h3><button class="btn ghost sm" data-act="statsMatch" data-id="${esc(m.id)}">Ver estadísticas</button></div>
      ${summaryCard('Total del partido', sumAll)}
      ${m.convocados.map((id) => summaryCard(gkLabel(id), H.defensiveSummary(shots.filter((s) => s.gkId === id)), id === m.currentGk ? '<span class="pill ok">En cancha</span>' : '')).join('')}
      ${sancs.length ? sancCard(m, sancs) : ''}
      ${goalsAll.length ? `<div class="card stack" id="goals-card" style="gap:6px"><div class="eyebrow">Goles de nuestro equipo por jugador</div>${H.goalStats(goalsAll, S.squad).map((r) => `<div class="small num" data-scorer="${esc(r.key)}"><b>${esc(r.label)}</b>: ${r.goles} ${r.goles === 1 ? 'gol' : 'goles'}</div>`).join('')}<div class="muted small">Marcador: ${m.scoreUs} · goles con jugador indicado: ${goalsAll.length} (incluye asistencias del arquero)</div></div>` : ''}
      ${plays.length ? `<div class="card stack" id="off-card" style="gap:6px"><div class="eyebrow">Aporte ofensivo de los arqueros</div>${H.offByGk(plays).map((g) => `<div class="small num" data-off="${esc(g.gkId)}"><b>${esc(gkLabel(g.gkId))}</b>: ${g.o.goles} ${g.o.goles === 1 ? 'gol' : 'goles'} · ${g.o.asistencias} ${g.o.asistencias === 1 ? 'asistencia' : 'asistencias'}</div>`).join('')}</div>` : ''}
      <div class="sec-head"><h3>Historial del partido</h3><span class="muted small">${shots.length} lanzamientos · ${plays.length} ofensivas · ${goals.length} goles · ${changes.length} cambios</span></div>
      ${events.length ? `<ul class="evts">${evHtml}</ul>` : '<div class="card empty"><h3>Sin acciones todavía</h3><p>Iniciá el partido y registrá cada lanzamiento que reciba el arquero.</p></div>'}
      <div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="editMatch" data-id="${esc(m.id)}">Editar datos</button>
        ${ui.confirm === 'delm-' + m.id ? `<span class="small" style="font-weight:600">¿Eliminar el partido y sus lanzamientos?</span><button class="btn danger sm" data-act="doDelMatch" data-id="${esc(m.id)}">Sí, eliminar</button><button class="btn ghost sm" data-act="cancel">No</button>` : `<button class="btn danger sm" data-act="askDelMatch" data-id="${esc(m.id)}">Eliminar partido</button>`}</div>
    </div>`;
  }

  function gkOff(id, mids) {
    const o = H.offensiveSummary(S.plays.filter((x) => !x.deleted && x.gkId === id && mids[x.matchId]));
    return o.participaciones ? `<div class="small num" id="gk-off">Aporte ofensivo: ${o.goles} ${o.goles === 1 ? 'gol' : 'goles'} · ${o.asistencias} ${o.asistencias === 1 ? 'asistencia' : 'asistencias'}</div>` : '';
  }
  function gkStatsCard(p) {
    const mids = {}; S.matches.forEach((m) => { if (!m.deleted && m.clubId === ui.clubId) mids[m.id] = 1; });
    const shots = S.shots.filter((s) => !s.deleted && s.gkId === p.id && mids[s.matchId]);
    if (!shots.length) return '<div class="card stack" style="gap:6px"><div class="eyebrow">Rendimiento en partidos</div><div class="muted small">Todavía no tiene lanzamientos registrados.</div></div>';
    const s = H.defensiveSummary(shots); const pj = {}; shots.forEach((x) => { pj[x.matchId] = 1; });
    return `<div class="card stack"><div class="eyebrow">Rendimiento en partidos</div>
      <div class="stats3"><div class="stat"><b class="num">${s.atajadas}</b><span class="muted small">Atajadas</span></div><div class="stat"><b class="num">${s.goles}</b><span class="muted small">Goles recibidos</span></div><div class="stat"><b class="num">${H.formatPct(s.efectividad)}</b><span class="muted small">Efectividad</span></div></div>
      <div class="muted small num">${Object.keys(pj).length} ${Object.keys(pj).length === 1 ? 'partido' : 'partidos'} con registro · ${s.alArco} lanzamientos al arco</div>${gkOff(p.id, mids)}
      <div><button class="btn ghost sm" data-act="statsGk" data-id="${esc(p.id)}">Ver estadísticas completas</button></div></div>`;
  }

  /* ----- Formulario de partido ----- */
  function matchDefaults() {
    const t = teams()[0];
    const r = t ? H.rosterFor(players(), t.id) : { titular: [], suplente: [] };
    const conv = r.titular.concat(r.suplente).map((p) => p.id);
    return { date: today(), time: '', teamId: t ? t.id : '', tournamentId: '', rival: '', venue: '', isHome: true, periodMinutes: [30, 30, 5, 5], convocados: conv, starterGk: r.titular[0] ? r.titular[0].id : (conv[0] || '') };
  }
  function matchForm(m, errors, editId) {
    const old = editId ? S.matches.find((x) => x.id === editId) : null;
    const locked = !!old && old.status !== 'programado';
    const pl = H.sortPlayers(players().filter((p) => p.active !== false));
    const tm = teams(); const tr = tournaments();
    const dis = locked ? ' disabled' : '';
    const starters = pl.filter((p) => m.convocados.indexOf(p.id) >= 0);
    return `${sheetHead(editId ? 'Editar partido' : 'Nuevo partido')}
    <form data-form="match" data-id="${esc(editId || '')}" class="stack" novalidate>
      ${locked ? '<div class="banner">El partido ya empezó: el equipo, los convocados y la duración no se pueden cambiar.</div>' : ''}
      <div class="grid2">
        <div class="${fcls(errors, 'date')}"><label for="m-date">Fecha</label><input class="input" type="date" id="m-date" name="date" value="${esc(m.date)}">${fieldErr(errors, 'date')}</div>
        <div class="${fcls(errors, 'time')}"><label for="m-time">Hora (opcional)</label><input class="input" type="time" id="m-time" name="time" value="${esc(m.time)}">${fieldErr(errors, 'time')}</div>
      </div>
      <div class="${fcls(errors, 'teamId')}"><label for="m-team">Nuestro equipo</label><select class="input" id="m-team" name="teamId"${dis}>${options(tm.map((t) => [t.id, t.name + ' · ' + seasonName(t.seasonId)]), m.teamId, 'Elegí el equipo')}</select>${fieldErr(errors, 'teamId')}</div>
      <div class="grid2">
        <div class="${fcls(errors, 'rival')}"><label for="m-rival">Rival</label><input class="input" id="m-rival" name="rival" value="${esc(m.rival)}" maxlength="60" autocomplete="off">${fieldErr(errors, 'rival')}</div>
        <div class="field"><label for="m-side">Condición</label><select class="input" id="m-side" name="side"><option value="local"${m.isHome ? ' selected' : ''}>Local</option><option value="visitante"${m.isHome ? '' : ' selected'}>Visitante</option></select></div>
        <div class="field"><label for="m-venue">Lugar (opcional)</label><input class="input" id="m-venue" name="venue" value="${esc(m.venue)}" maxlength="80"></div>
        <div class="field"><label for="m-tour">Torneo (opcional)</label><select class="input" id="m-tour" name="tournamentId">${options(tr.map((t) => [t.id, t.name]), m.tournamentId, 'Sin torneo')}</select></div>

  function refreshStarter() {

  function submitMatch(form) {

    const m = H.normalizeMatch(raw);

  }

  /* ----- Formulario de lanzamiento ----- */

      <fieldset><legend>Zona de destino</legend>
        <div class="zonegrid" role="radiogroup" aria-label="Zona del arco, vista desde el lanzador">${short.map((t, i) => `<label class="zone"><input type="radio" name="zone" value="${i + 1}"${zsel === String(i + 1) ? ' checked' : ''}><span><b>${i + 1}</b><small>${t}</small></span></label>`).join('')}</div>
        <div class="chips"><label class="chip"><input type="radio" name="zone" value=""${zsel === '' ? ' checked' : ''}><span>Sin zona</span></label></div>

      <fieldset><legend>Tipo de lanzamiento</legend>${radios('type', [['', 'Sin indicar']].concat(H.SHOT_TYPES), s.type)}${fieldErr(errors, 'type')}</fieldset>
      <fieldset><legend>Distancia</legend>
        <div class="${fcls(errors, 'distance')}"><label for="s-dist">Metros (opcional)</label><input class="input num" id="s-dist" name="distance" inputmode="decimal" autocomplete="off" placeholder="${hint}" value="${s.distance == null ? '' : dec(s.distance)}">${fieldErr(errors, 'distance')}</div>

        <div class="field" id="sectors"${src === 'medida' ? ' hidden' : ''}><span class="lbl">O elegí un sector de la cancha</span><div class="chips">${H.DIST_SECTORS.map((d) => `<button type="button" class="btn ghost sm${s.distanceSector === d[0] ? ' on' : ''}" data-act="sector" data-id="${d[0]}" data-val="${d[2]}" aria-pressed="${s.distanceSector === d[0]}">${esc(d[1])}</button>`).join('')}</div></div>

      ${errors && Object.keys(errors).length ? '<div class="err-msg" role="alert">Revisá los campos marcados antes de guardar.</div>' : ''}
      <div class="sheet-actions stack">
        <div class="row"><button class="btn orange" type="submit">${editId ? 'Guardar cambios' : 'Guardar lanzamiento'}</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div>
        ${editId ? (ui.confirm === 'dels-' + editId ? `<div class="row"><span class="small" style="font-weight:600">¿Eliminar este lanzamiento?</span><button type="button" class="btn danger sm" data-act="doDelShot" data-id="${esc(editId)}">Sí, eliminar</button><button type="button" class="btn ghost sm" data-act="cancelShot" data-id="${esc(editId)}">No</button></div>` : `<div><button type="button" class="btn danger sm" data-act="askDelShot" data-id="${esc(editId)}">Eliminar lanzamiento</button></div>`) : ''}

  function openShotForm(editId) {
    const m = matchById(ui.matchId); if (!m) return;

  function writeShot(rec, old, msg) {
    const m = matchById(ui.matchId);

  }
  function writePlay(rec, old, msg) {
    const m = matchById(ui.matchId);
    const m2 = Object.assign({}, m, { scoreUs: Math.max(0, m.scoreUs + H.playScoreDelta(old, rec)) });
    return Promise.all([save('plays', rec), save('matches', m2)]).then(() => { toast(msg); render(); });
  }
  function submitShot(form) {
    const m = matchById(ui.matchId); if (!m) return;
    const id = form.getAttribute('data-id'); const fd = new FormData(form);
    const s = H.normalizeShot({ origin: fd.get('origin'), result: fd.get('result'), type: fd.get('type'), zone: fd.get('zone'), distance: fd.get('distance'), distanceSource: fd.get('distanceSource'), distanceSector: fd.get('distanceSector'), gkId: fd.get('gkId') });
