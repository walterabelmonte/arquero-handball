  /* ----- Cambio de arquero ----- */
  function openChange() {
    const m = matchById(ui.matchId); if (!m || !H.canRecord(m)) return;
    ui.changeCtx = { t: H.eventSecond(m, Date.now()), period: m.period };
    const others = m.convocados.filter((id) => id !== m.currentGk);
    openSheet(`${sheetHead('Cambio de arquero')}
      <form data-form="change" class="stack" novalidate>
        <div class="card stack" style="gap:6px"><div class="eyebrow">Sale</div><div class="name">${esc(gkLabel(m.currentGk))}</div><div class="muted small num">Minuto ${mmss(ui.changeCtx.t)} · ${esc(periodLabel(m.period))}</div></div>
        <fieldset><legend>Entra</legend><div class="chips">${others.map((id) => `<label class="chip"><input type="radio" name="gkIn" value="${esc(id)}"><span>${esc(gkLabel(id))}</span></label>`).join('')}</div></fieldset>
        <div class="err-msg" id="ch-err" role="alert" hidden></div>
        <div class="muted small">Los próximos lanzamientos se asignan al arquero que entra. Las estadísticas de cada uno se mantienen separadas.</div>
        <div class="row"><button class="btn orange" type="submit">Confirmar cambio</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div>
      </form>`);
  }
  function submitChange(form) {
    const m = matchById(ui.matchId); if (!m) return;

    const ctx = ui.changeCtx || { t: H.eventSecond(m, Date.now()), period: m.period };
    const r = H.applyChange(m, inId, ctx.t, ctx.period);
    Promise.all([save('changes', Object.assign({ id: H.uuid(), clubId: ui.clubId, matchId: m.id, deleted: false }, r.change)), save('matches', r.match)]).then(() => { toast('Cambio registrado'); closeSheet(); render(); });
  }

  /* ----- Reloj y marcador ----- */
  function updateMatch(fn, msg) {
    const m = matchById(ui.matchId); if (!m) return;
    const m2 = fn(m); if (m2 === m) return;
    save('matches', m2).then(() => { if (msg) toast(msg); render(); });
  }
  setInterval(() => {
    const el = $('#clock'); if (!el || !ui.matchId) return;
    const m = matchById(ui.matchId); if (!m) return;
    const ms = H.elapsedMs(m, Date.now());
    el.textContent = H.formatClock(H.periodLeftMs(m, Date.now()));
    document.querySelectorAll('[data-pen-end]').forEach((n) => { const left = Number(n.getAttribute('data-pen-end')) - Math.floor(ms / 1000); const t = n.textContent.replace(/ \d\d:\d\d$| terminó$/, ''); n.textContent = left > 0 ? t + ' ' + mmss(left) : t + ' terminó'; });
    const over = $('#timeover'); const idx = H.periodIndex(m.period);
    if (over) over.hidden = !(m.status === 'en_juego' && idx >= 0 && idx < 4 && ms >= H.periodStartSec(m, idx + 1) * 1000);
  }, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.matchId) { const m = matchById(ui.matchId); syncWake(!!m && m.status === 'en_juego'); } });

  /* ----- Registro rápido ----- */
  function quickBar(m) {
    const s = H.defensiveSummary(shotsOf(m.id).filter((x) => x.gkId === m.currentGk));
    const o = H.offensiveSummary(playsOf(m.id).filter((x) => x.gkId === m.currentGk));
    return `<div class="fab quickbar" role="group" aria-label="Registro rápido para ${esc(gkLabel(m.currentGk))}">
      <div class="qgk">${esc(gkLabel(m.currentGk))} · ${H.formatPct(s.efectividad)}</div>
      <button class="qbtn save" data-act="quick" data-id="atajada"><span>Atajada</span><b class="num" id="q-saves">${s.atajadas}</b></button>
      <button class="qbtn goal" data-act="quick" data-id="gol"><span>Gol recibido</span><b class="num" id="q-goals">${s.goles}</b></button>
      <button class="qbtn more" data-act="newShot" aria-label="Registrar lanzamiento con detalle"><span aria-hidden="true">＋</span><small>Detalle</small></button>
      <button class="qbtn off" data-act="quickPlay" data-id="gol_arquero"><span>Gol del arquero</span><b class="num" id="q-agoals">${o.goles}</b></button>
      <button class="qbtn off" data-act="quickPlay" data-id="asistencia"><span>Asistencia</span><b class="num" id="q-assists">${o.asistencias}</b></button>
      <div class="qsanc" role="group" aria-label="Faltas y sanciones">${H.SANCTION_KINDS.map((k) => `<button class="qs ${k.id}" data-act="sancOpen" data-id="${k.id}" aria-label="${esc(k.name)}"><span class="sdot ${k.id}" aria-hidden="true"></span><span>${esc(k.short)}</span></button>`).join('')}</div></div>`;
  }
  const sancOf = (mid) => S.sanctions.filter((z) => z.matchId === mid && !z.deleted);
  const SANC_PL = { amarilla: ['amarilla', 'amarillas'], exclusion: ['exclusión', 'exclusiones'], roja: ['roja', 'rojas'], azul: ['azul', 'azules'] };
  const sancRowText = (r) => ['amarilla', 'exclusion', 'roja', 'azul'].filter((k) => r[k]).map((k) => r[k] + ' ' + SANC_PL[k][r[k] === 1 ? 0 : 1]).join(' · ');
  const sideName = (side) => (side === 'us' ? 'Nuestro equipo' : 'Rival');
  const sancWho = (z) => {
    if (z.official) return 'Oficial de equipo';
    if (z.side !== 'us') return z.jersey !== null && z.jersey !== undefined ? '#' + z.jersey : 'Sin identificar';
    const q = z.playerId ? S.squad.find((x) => x.id === z.playerId) : null; if (q) return H.squadLabel(q);
    const g = z.gkId ? pAny(z.gkId) : null; if (g) return gkLabel(z.gkId);
    return z.jersey !== null && z.jersey !== undefined ? '#' + z.jersey : 'Sin identificar';
  };
  const chipHtml = (kind, n) => `<span class="sdot ${kind}" title="${esc(H.sanctionName(kind))}" aria-hidden="true"></span>${n}`;
  const countsLine = (c) => ['amarilla', 'exclusion', 'roja', 'azul'].map((k) => `<span class="scount" aria-label="${esc(H.sanctionShort(k))}: ${c[k]}">${chipHtml(k, c[k])}</span>`).join('');
  const recvLabel = (p) => { const q = p.receiverId ? S.squad.find((x) => x.id === p.receiverId) : null; return q ? H.squadLabel(q) : p.receiverJersey !== null && p.receiverJersey !== undefined ? '#' + p.receiverJersey : ''; };
  const playName = (k) => (H.PLAY_KINDS.find((x) => x.id === k) || { name: k }).name;
  function sancCard(m, sancs) {
    const nowSec = H.eventSecond ? H.eventSecond(m, Date.now()) : Math.floor(H.elapsedMs(m, Date.now()) / 1000);
    const pen = (side) => H.activePenalties(sancs, side, nowSec);
    const line = (side) => { const c = H.sanctionCounts(sancs, side), a = pen(side); return `<div class="stack" style="gap:4px"><div class="row between"><b>${sideName(side)}</b><span class="scounts">${countsLine(c)}</span></div>${a.length ? `<div class="pen" data-pen-side="${side}">Jugando con ${a.length} menos · ${a.map((x) => `<span class="num" data-pen-end="${x.endSec}">${esc(sancWho(x.rec))} ${mmss(x.left)}</span>`).join(' · ')}</div>` : ''}</div>`; };
    const rank = H.sanctionRanking(sancs, S.squad, S.players);
    return `<div class="card stack" id="sanc-card" style="gap:8px"><div class="eyebrow">Sanciones del partido</div>${line('us')}${line('rival')}${rank.length ? `<div class="stack" style="gap:3px">${rank.map((r) => `<div class="small num" data-sanc-row="${esc(r.key)}"><b>${esc(r.label)}</b>: ${sancRowText(r)}</div>`).join('')}</div>` : ''}<div class="muted small">Amarilla: máx. 1 por jugador y 3 por equipo; después corresponde exclusión. Un jugador excluido ya no recibe amarilla. A la 3.ª exclusión se suma la roja. Oficiales de equipo: 1 amarilla y 1 exclusión en total. Roja y azul: el jugador sale del partido y el equipo juega 2 minutos con uno menos (4 si es combinada). Tocá un registro del historial para ver el motivo o quitarlo.</div></div>`;
  }
  function lastShotCard(m, shots) {
    const le = H.canRecord(m) ? H.lastEvent(shots, playsOf(m.id)) : null;
    if (!le) return '';
    const last = le.rec, what = le.type === 'play' ? playName(last.kind) : H.labelOf(H.RESULTS, last.result);
    return `<div class="card row between" id="last-shot"><div class="grow small"><div class="eyebrow">Último registro</div><div class="num"><b>${esc(what)}</b>${le.type === 'play' && last.kind === 'asistencia' && recvLabel(last) ? ' → ' + esc(recvLabel(last)) : ''} · ${mmss(last.t)} · ${esc(gkLabel(last.gkId))}</div></div><button class="btn ghost sm" data-act="undoShot">Deshacer</button></div>`;
  }

  /* ---------- Etapa 3: estadísticas defensivas ---------- */
  const statsDefaults = () => ({ gkId: '', matchId: '', tournamentId: '', category: '', seasonId: '', playerId: '', metric: 'efectividad', zone: 0 });
  ui.stats = statsDefaults();
  function scorerData(st) {
    const f = { clubId: ui.clubId, matchId: st.matchId, tournamentId: st.tournamentId, category: st.category, seasonId: st.seasonId };
    const d = { goals: S.goals.concat(assistGoals()), matches: S.matches, teams: S.teams };
    const all = H.filterGoals(d, f), picked = st.playerId ? H.filterGoals(d, Object.assign({}, f, { playerId: st.playerId })) : all;
    return { all, picked, ranking: H.goalStats(all, S.squad), summary: st.playerId ? H.playerGoalSummary(picked) : null };
  }
  function sancData(st) {
    const f = { clubId: ui.clubId, matchId: st.matchId, tournamentId: st.tournamentId, category: st.category, seasonId: st.seasonId, playerId: st.playerId };
    const list = H.filterSanctions({ sanctions: S.sanctions, matches: S.matches, teams: S.teams }, f);
    return { list, us: H.sanctionCounts(list, 'us'), rival: H.sanctionCounts(list, 'rival'), ranking: H.sanctionRanking(list, S.squad, S.players) };
  }
  function exportStatsPdf() {
    const st = ui.stats, f = { clubId: ui.clubId, gkId: st.gkId, matchId: st.matchId, tournamentId: st.tournamentId, category: st.category, seasonId: st.seasonId };
    const data = { shots: S.shots, matches: S.matches, teams: S.teams, plays: S.plays };
    const shots = H.filterShots(data, f), plays = H.filterPlays(data, f);
    const sc = scorerData(st);
    const sd = sancData(st);
    if (!shots.length && !plays.length && !sc.all.length && !sd.list.length) { toast('No hay datos para exportar'); return; }
    if (st.playerId) { const sp = squadById(st.playerId); if (sp) st.__pn = H.squadLabel(sp); }
    const filt = [];
    if (st.gkId) { const p = playerById(st.gkId); if (p) filt.push('Arquero: ' + H.fullName(p)); }
    if (st.matchId) { const m = matchById(st.matchId); if (m) filt.push('Partido: ' + fmtDate(m.date) + ' vs ' + m.rival); }
    if (st.tournamentId) filt.push('Torneo: ' + tournamentName(st.tournamentId));
    if (st.category) filt.push('Categoría: ' + H.catName(st.category));
    if (st.seasonId) filt.push('Temporada: ' + seasonName(st.seasonId));
    if (st.playerId && st.__pn) filt.push('Jugador de campo: ' + st.__pn);
    const rows = H.matchRows(shots, data, plays).map((r) => ({
      head: fmtDate(r.match.date) + ' - ' + teamName(r.match.teamId) + ' - vs ' + r.match.rival, s: r.s,
      gks: !st.gkId && r.gks.length > 1 ? r.gks.map((g) => ({ label: gkLabel(g.gkId), s: g.s })) : [],

  document.addEventListener('submit', (ev) => {
    const form = ev.target.closest('[data-form]'); if (!form) return;
    ev.preventDefault();
    const kind = form.getAttribute('data-form');
    if (kind === 'player') submitPlayer(form);
    else if (kind === 'team') submitTeam(form);
    else if (kind === 'club') submitClub(form);
    else if (kind === 'match') submitMatch(form);
    else if (kind === 'shot') submitShot(form);
    else if (kind === 'change') submitChange(form);
    else if (kind === 'squadBulk') submitSquadBulk(form);
    else if (kind === 'squadOne') submitSquadOne(form);
    else if (kind === 'sanc') saveSanction(form.getAttribute('data-id'), new FormData(form).get('jersey'));
    else if (kind === 'assist') saveAssist(new FormData(form).get('jersey'));
    else if (kind === 'goal') { const v = new FormData(form).get('jersey'); saveGoal(v); }
    else if (kind === 'tournament') {
      const name = String(new FormData(form).get('name') || '').replace(/\s+/g, ' ').trim();
      if (!name) { toast('Ingresá el nombre del torneo'); return; }
      if (tournaments().some((t) => t.name.toLowerCase() === name.toLowerCase())) { toast('Ese torneo ya existe'); return; }
      save('tournaments', { id: H.uuid(), clubId: ui.clubId, seasonId: seasons()[0] ? seasons()[0].id : '', name, deleted: false }).then(() => { toast('Torneo agregado'); render(); });
    } else if (kind === 'season') {
      const name = String(new FormData(form).get('name') || '').trim();
      if (!name) { toast('Ingresá el nombre de la temporada'); return; }
      if (seasons().some((s) => s.name.toLowerCase() === name.toLowerCase())) { toast('Esa temporada ya existe'); return; }
      save('seasons', { id: H.uuid(), clubId: ui.clubId, name, deleted: false }).then(() => { toast('Temporada agregada'); render(); });
    } else if (kind === 'restore') doRestore(String(new FormData(form).get('text') || ''));
    else if (kind === 'transfer') {
      const id = form.getAttribute('data-id'); const fd = new FormData(form); const dest = String(fd.get('dest') || '').trim(); const date = String(fd.get('date') || '');
      if (!dest) { const f = $('#tr-dest-f'); if (!f.querySelector('.err-msg')) f.insertAdjacentHTML('beforeend', '<div class="err-msg" role="alert">Ingresá el club de destino.</div>'); return; }

      const m = matchById(ui.matchId); if (!m) return;
      const who = ev.target.value === '' ? null : sancWhoFrom(ev.target.value, '');
      el.textContent = ev.target.value === '' ? '\u00a0' : !who ? 'Número inválido.' : (who.playerId || who.gkId) ? sancWho({ side: ui.sancSide || 'us', playerId: who.playerId, gkId: who.gkId, jersey: who.jersey }) : 'Ese número no está cargado (se guarda igual).';
      wl.textContent = who ? H.sanctionWarnings(sancOf(m.id), ui.sancSide || 'us', who, kind, sancCtx(m)).map((x) => '⚠ ' + x).join(' ') : '';
      return;
    }
    if (ev.target.id === 'g-num') {
      const m = matchById(ui.matchId), el = $('#g-who'); if (!m || !el) return;
      const v = ev.target.value.trim(); ev.target.value = v.replace(/\D/g, '').slice(0, 2);
      const r = ev.target.value === '' ? null : H.resolveJersey(clubSquad(), teamById(m.teamId), ev.target.value), p = r && r.player;
      el.textContent = ev.target.value === '' ? '\u00a0' : p ? H.squadLabel(p) + (r.exact ? '' : ' (de otra categoría)') : r.count > 1 ? 'Hay ' + r.count + ' jugadores con ese número en otras categorías: tocá al jugador de la lista.' : 'No hay ningún jugador con ese número cargado (se guarda igual).';
      return;
    }
    if (ev.target.id === 'jq') { ui.jq = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $('#jq'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* sin cursor */ } } return; }
    if (ev.target.id === 'q') { ui.q = ev.target.value; renderList(); }
    else if (ev.target.id === 's-dist') { const sc = $('#s-sector'); if (sc && sc.value) { sc.value = ''; document.querySelectorAll('[data-act="sector"]').forEach((b) => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }); } }
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  $('#sheet').addEventListener('click', (ev) => { if (ev.target.classList.contains('sheet-bg')) closeSheet(); });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TABS.some((t) => t[0] === h) && h !== ui.tab) { ui.tab = h; render(); } });

  /* ---------- Arranque ---------- */
  async function boot() {
    try { db = await openDB(); persistent = true; } catch (e) { db = null; persistent = false; }
    if (db) {
      try { for (const s of STORES) { const rows = await idbAll(s); if (s === 'settings') rows.forEach((r) => { S.settings[r.id] = r; }); else S[s] = rows; } }
      catch (e) { persistent = false; }
    }
    if (!S.clubs.length && !S.settings.seeded) {
      const d = H.seedDemo(new Date().toISOString());
      await save('clubs', d.club);
      for (const k of ['seasons', 'teams', 'players', 'history']) for (const r of d[k]) await save(k, r);
      await save('settings', { id: 'seeded', value: true });
    }
    if (!S.settings.seeded2) {
      const okDemo = S.clubs.some((c) => c.id === 'demo-club') && S.teams.some((t) => t.id === 'demo-t2' && !t.deleted) && ['demo-p2', 'demo-p4'].every((id) => S.players.some((p) => p.id === id && !p.deleted));
      if (okDemo && !S.matches.some((m) => m.id === 'demo-m1')) {
        const d2 = H.seedDemoMatch(new Date().toISOString());
        for (const k of ['tournaments', 'matches', 'shots', 'changes', 'plays', 'squad', 'goals']) for (const r of d2[k]) await save(k, r);
      }
      await save('settings', { id: 'seeded2', value: true });
    }
    if (!S.settings.seeded4) {
      if (S.matches.some((m) => m.id === 'demo-m1') && !S.squad.some((p) => p.id === 'demo-j1')) { const d4 = H.seedDemoMatch(new Date().toISOString()); for (const r of d4.squad) await save('squad', r); for (const r of d4.goals) await save('goals', r); }
      await save('settings', { id: 'seeded4', value: true });
    }
    if (!S.settings.seeded3) {
      if (S.matches.some((m) => m.id === 'demo-m1') && !S.plays.some((p) => p.id === 'demo-pl1')) for (const r of H.seedDemoMatch(new Date().toISOString()).plays) await save('plays', r);
      await save('settings', { id: 'seeded3', value: true });
    }
    const act = S.settings.active;
    ui.clubId = act && clubs().some((c) => c.id === act.clubId) ? act.clubId : (clubs()[0] ? clubs()[0].id : null);
    const h = location.hash.replace('#', ''); if (TABS.some((t) => t[0] === h)) ui.tab = h;
    $('#boot').hidden = true;
    render();
    window.__hgp = { S, ui, ready: true };
  }
  boot();
})();


</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
